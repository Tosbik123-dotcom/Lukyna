<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <!-- WICHTIG: Das Viewport-Tag sorgt für die richtige Skalierung auf dem Handy -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Lukyna Otter App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #fce4ec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    #app-container {
      width: 100%;
      max-width: 420px;
      height: 100vh;
      max-height: 850px;
      background: linear-gradient(to bottom, #e3f2fd, #fff3e0);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      position: relative;
    }

    /* Statusleisten */
    .stats-bar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      background: rgba(255, 255, 255, 0.85);
      padding: 12px;
      border-radius: 16px;
      backdrop-filter: blur(5px);
    }

    .stat {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      font-weight: bold;
      color: #444;
    }

    .bar-outer {
      flex: 1;
      height: 12px;
      background: #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    .bar-inner {
      height: 100%;
      width: 80%;
      transition: width 0.3s ease;
      border-radius: 6px;
    }

    #hunger-bar { background: #ff7043; }
    #happy-bar { background: #ec407a; }
    #energy-bar { background: #42a5f5; }

    /* Otter Bereich */
    .pet-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .otter-avatar {
      font-size: 90px;
      text-align: center;
      transition: transform 0.2s ease;
      cursor: pointer;
    }

    .otter-avatar:active {
      transform: scale(1.15);
    }

    .speech-bubble {
      background: #ffffff;
      padding: 10px 16px;
      border-radius: 18px;
      font-size: 14px;
      color: #333;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
      margin-bottom: 12px;
      text-align: center;
      max-width: 80%;
    }

    /* Aktionsleiste / Buttons */
    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 10px;
    }

    .btn {
      background: #ffffff;
      border: 2px solid #f8bbd0;
      color: #d81b60;
      padding: 12px;
      border-radius: 12px;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .btn:active {
      background: #f8bbd0;
      color: white;
    }
  </style>
</head>
<body>

  <div id="app-container">
    <!-- Status-Werte -->
    <div class="stats-bar">
      <div class="stat">
        <span>🍕 Hunger</span>
        <div class="bar-outer"><div id="hunger-bar" class="bar-inner"></div></div>
      </div>
      <div class="stat">
        <span>💖 Glück</span>
        <div class="bar-outer"><div id="happy-bar" class="bar-inner"></div></div>
      </div>
      <div class="stat">
        <span>⚡ Energie</span>
        <div class="bar-outer"><div id="energy-bar" class="bar-inner"></div></div>
      </div>
    </div>

    <!-- Otter Anzeige -->
    <div class="pet-container">
      <div class="speech-bubble" id="dialogue">Hallo! Ich bin dein Otter 🦦</div>
      <div class="otter-avatar" id="otter" onclick="petOtter()">🦦</div>
    </div>

    <!-- Interaktions-Buttons -->
    <div class="actions">
      <button class="btn" onclick="feedOtter()">🍱 Füttern</button>
      <button class="btn" onclick="playOtter()">🎮 Spielen</button>
      <button class="btn" onclick="sleepOtter()">😴 Schlafen</button>
      <button class="btn" onclick="loveOtter()">❤️ Liebhaben</button>
    </div>
  </div>

  <script>
    function petOtter() {
      document.getElementById('dialogue').innerText = " *Squeak!* Das tut gut! 💕";
    }

    function feedOtter() {
      document.getElementById('dialogue').innerText = "Mmmh, lecker! Danke! ☕🍰";
    }

    function playOtter() {
      document.getElementById('dialogue').innerText = "Juhu, das macht Spaß! 🎉";
    }

    function sleepOtter() {
      document.getElementById('dialogue').innerText = "Gute Nacht... Zzz... 🌙";
    }

    function loveOtter() {
      document.getElementById('dialogue').innerText = "Ich hab dich auch lieb! 💖";
    }
  </script>
</body>
</html>
